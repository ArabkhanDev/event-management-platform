server:
  # PaaS hosts (Render, Fly, Koyeb) inject the port to bind on as PORT.
  port: ${PORT:8080}

spring:
  application:
    name: meet2be-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meet2be}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Serverless Postgres (Neon) caps concurrent connections well below the
      # Hikari default of 10, and a 512MB container cannot afford more anyway.
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  jackson:
    default-property-inclusion: non_null
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:40MB}
      max-request-size: ${MAX_UPLOAD_SIZE:40MB}
  mail:
    # Credentials are supplied per-environment — never defaulted in source.
    # Free PaaS hosts commonly block outbound 25/465/587, so relays that also
    # listen on 2525 (Brevo, Mailtrap, SendGrid) are configurable via MAIL_PORT.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

meet2be:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-this-must-be-at-least-32-bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:no-reply@meet2be.local}
  public:
    api-base-url: ${PUBLIC_API_BASE_URL:http://localhost:8080}
    app-base-url: ${PUBLIC_APP_BASE_URL:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # The default indicator opens an SMTP connection on every probe. A relay
    # being unreachable does not mean the service is unable to serve requests,
    # and letting it report DOWN makes the platform restart-loop the container.
    mail:
      enabled: false

logging:
  level:
    com.meet2be: INFO
